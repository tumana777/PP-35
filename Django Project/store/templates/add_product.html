{% extends 'base.html' %}
{% load crispy_forms_filters %}

{% block title %} Add New Product {% endblock %}

{% block content %}
    <form method="post" class="my_form" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form|crispy }}
        <button class="btn btn-success" type="submit">Save Product</button>
    </form>
{% endblock %}
