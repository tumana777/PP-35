<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{{ product.name }}</title>
</head>
<body>
    <h2>Product Detail</h2>
    <p>Name: {{ product.name }}</p>
    <p>Price: {{ product.price }}</p>
    <p>Qty: {{ product.quantity }}</p>
    <p>Description: {{ product.description }}</p>
    <p>Category: {{ product.category.name }}</p>
    <a href="{% url 'store:update_product' product_pk=product.pk %}">Update Product</a>
    <hr>
    <form action="{% url 'store:delete_product' product_pk=product.pk %}" method="post" onsubmit="return confirm('Are you sure you want to delete this product?')">
        {% csrf_token %}
        <button>Delete Product</button>
    </form>
    <hr>
    <a href="{% url 'store:products' %}">Back to Products</a>
</body>
</html>
